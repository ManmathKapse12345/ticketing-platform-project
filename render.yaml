# Render Blueprint: API + worker + Postgres + Redis (Key Value).
# Dashboard > New > Blueprint > pick this repo. Values marked `sync: false`
# are asked for once in the dashboard and never stored in git.
envVarGroups:
  - name: ticketing-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: PAYOUT_ENCRYPTION_KEY
        sync: false # 64 hex chars: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

services:
  - type: web
    name: ticketing-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    # Migrations run before the server starts, so the schema always matches the code.
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /health
    envVars:
      - fromGroup: ticketing-shared
      - key: DATABASE_URL
        fromDatabase:
          name: ticketing-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ticketing-redis
          property: connectionString

  # Background workers aren't on Render's free plan.
  - type: worker
    name: ticketing-worker
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker
    envVars:
      - fromGroup: ticketing-shared
      - key: DATABASE_URL
        fromDatabase:
          name: ticketing-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ticketing-redis
          property: connectionString

  - type: keyvalue
    name: ticketing-redis
    plan: free
    # BullMQ must never have its keys evicted.
    maxmemoryPolicy: noeviction
    ipAllowList: [] # only reachable from services in this Render account

databases:
  - name: ticketing-db
    plan: free
    databaseName: ticketing
