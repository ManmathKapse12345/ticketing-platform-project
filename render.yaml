# Render Blueprint: API + web app + Postgres, all on free plans (no card needed).
# Dashboard > New > Blueprint > pick this repo. Values marked `sync: false`
# are asked for once in the dashboard and never stored in git.
#
# The background worker (ticket PDF emails) isn't here because Render has no free
# plan for workers. Without it, JOB_QUEUE_DISABLED skips the queue: payments,
# tickets and check-in all work, and customers download their PDF from the order
# page instead of getting it by email. To add it back later (paid), see the
# commented-out block at the end of this file.
envVarGroups:
  - name: ticketing-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: PAYOUT_ENCRYPTION_KEY
        sync: false # 64 hex chars: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

services:
  - type: web
    name: ticketing-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    # Migrations run before the server starts, so the schema always matches the code.
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /health
    envVars:
      - fromGroup: ticketing-shared
      - key: DATABASE_URL
        fromDatabase:
          name: ticketing-db
          property: connectionString
      - key: JOB_QUEUE_DISABLED
        value: "true" # no worker/Redis on the free plan; remove when adding them

  # The React app. /api is forwarded to the API, so the browser sees one site:
  # the login cookie (sameSite: strict) only works if the API looks same-origin.
  # The destination is the API's real Render URL (Render added the -vdgi suffix).
  - type: web
    name: ticketing-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ticketing-api-vdgi.onrender.com/api/*
      # Every other path is a React Router page.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ticketing-db
    plan: free
    databaseName: ticketing

